; Scalability groups (spec 8 / K-F, plan F3 Task 7): each sg.<Group>=N (0 Low, 1 Medium, 2 High, 3 Epic,
; 4 Cinematic) sets the cvars of section [<Group>@N] at CVarSource::Scalability, so an ini / command-line / code /
; console value of a single cvar still wins. Initial table: the full Low -> Cinematic table and the frame time of each
; level on the reference scene are F5 (K-F). The renderer embeds this file at build time (engine/renderer/CMakeLists.txt).
; Defaults: sg.ShadowQuality=3, sg.LightingQuality=3 (the r.* defaults equal those sections).
; r.Lighting.MaxLights is per object; T0 (D3D11 FL10_x, GLES 3.0) caps it at 8 (spec K-E), T1 / T2 at 64 in F3.

[ShadowQuality@0]
r.Shadow.Enable=0
r.Shadow.CascadeCount=1
r.Shadow.MapResolution=512
r.Shadow.Filter=Hard
r.Shadow.PointLights=0
r.Shadow.Distance=20

[ShadowQuality@1]
r.Shadow.Enable=1
r.Shadow.CascadeCount=1
r.Shadow.MapResolution=1024
r.Shadow.Filter=PCF
r.Shadow.PointLights=0
r.Shadow.Distance=30

[ShadowQuality@2]
r.Shadow.Enable=1
r.Shadow.CascadeCount=2
r.Shadow.MapResolution=1024
r.Shadow.Filter=PCF
r.Shadow.PointLights=1
r.Shadow.Distance=50

[ShadowQuality@3]
r.Shadow.Enable=1
r.Shadow.CascadeCount=3
r.Shadow.MapResolution=2048
r.Shadow.Filter=PCF
r.Shadow.PointLights=1
r.Shadow.Distance=100

[ShadowQuality@4]
r.Shadow.Enable=1
r.Shadow.CascadeCount=4
r.Shadow.MapResolution=4096
r.Shadow.Filter=PCF
r.Shadow.PointLights=1
r.Shadow.Distance=200

[LightingQuality@0]
r.Lighting.MaxLights=8
r.Lighting.Specular=0

[LightingQuality@1]
r.Lighting.MaxLights=8
r.Lighting.Specular=1

[LightingQuality@2]
r.Lighting.MaxLights=16
r.Lighting.Specular=1

[LightingQuality@3]
r.Lighting.MaxLights=64
r.Lighting.Specular=1

[LightingQuality@4]
r.Lighting.MaxLights=64
r.Lighting.Specular=1
