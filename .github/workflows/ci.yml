# F0 CI (plan F0 Task 8, spec §10): build + unit tests + golden report on Windows,
# build + unit tests on Linux.
# F1 (plan F1 Task 5, spec K2): macOS validates the committed MSL (tests/shaders/msl, generated by
# scripts/msl_artifacts.py on Windows, freshness checked by ctest shaderc.msl_artifacts_fresh) with
# `xcrun metal` for macosx and iphoneos. Compile-only: Metal runtime stays unverified (K2).
# F2 (plan F2 Task 1): runs on pushes to phase branches (f*) and by hand; the windows job installs the
# pinned Vulkan SDK and the shader toolchain, so shaderc tests run there and a Skipped one fails the job.
name: ci

on:
  push:
    branches: [main, 'f*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest   # windows-2025-vs2026: Visual Studio 18 2026 generator available
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Vulkan SDK 1.4.341.1 (pinned, sha256 checked)
        shell: pwsh
        run: |
          $version = '1.4.341.1'
          $exe = "vulkansdk-windows-X64-$version.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/$exe" -OutFile $exe
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne 'bcf2d75aa9556889ab974858666e20b3655b6055a0db704ccb47279ff33b5bfe') { throw "Vulkan SDK sha256 mismatch: $sha" }
          & ".\$exe" --root "C:\VulkanSDK\$version" --accept-licenses --default-answer --confirm-command install | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK install failed ($LASTEXITCODE)" }
          "VULKAN_SDK=C:\VulkanSDK\$version" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$version\Bin" >> $env:GITHUB_PATH
      - name: Cache shader toolchain (third_party/tools)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/tools/dxc
            third_party/tools/tint
            third_party/tools/downloads
          key: shader-tools-${{ runner.os }}-${{ hashFiles('third_party/tools/tools.lock.json') }}
      - name: Shader toolchain (DXC, Tint)
        run: python scripts/fetch_shader_tools.py
      - name: Configure
        run: cmake --preset win-msvc
      - name: Build (Debug)
        run: cmake --build --preset win-msvc --config Debug
      - name: Unit tests (ctest; a Skipped shaderc test fails the job)
        shell: pwsh
        run: |
          ctest --preset win-msvc -C Debug 2>&1 | Tee-Object -FilePath ctest.log
          $ctestExit = $LASTEXITCODE
          $skipped = Select-String -Path ctest.log -Pattern 'shaderc.*\*\*\*Skipped'
          if ($skipped) { $skipped | Out-Host; throw "shaderc tests were skipped (shader toolchain missing)" }
          exit $ctestExit
      - name: Python tests
        run: python -m unittest discover tests
      - name: Golden f00
        run: python scripts/run_golden.py --phase f00 --build-dir build/win-msvc --config Debug
      - name: Upload golden report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-report-f00-windows
          path: |
            tests/golden/out/f00/report.html
            tests/golden/out/f00/results.json
          if-no-files-found: warn

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ninja and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
      - name: Configure
        run: cmake --preset linux-clang
      - name: Build (Debug)
        run: cmake --build --preset linux-clang --config Debug
      - name: Unit tests (ctest)
        run: ctest --preset linux-clang -C Debug

  macos-metal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Metal toolchain
        # Newer Xcode ships the Metal toolchain as a separate component.
        run: |
          xcodebuild -version
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi
      - name: Validate committed MSL (xcrun metal, macosx + iphoneos)
        run: python scripts/check_metal.py --dir tests/shaders/msl --out metal-results.json
      - name: Upload Metal results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metal-results-f01
          path: metal-results.json
          if-no-files-found: warn
